<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <section class="side" aria-hidden="true">
      <p class="side-word">Welcome<br>back.</p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" id="tab-login" aria-selected="true" aria-controls="form-login">Sign in</button>
        <button class="tab" role="tab" id="tab-register" aria-selected="false" aria-controls="form-register">Create account</button>
      </div>

      <form id="form-login" class="form" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" name="email" type="email" autocomplete="email" required>

        <label for="login-password">Password</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>

        <p class="error" role="alert" aria-live="polite"></p>
        <button class="submit" type="submit">Sign in</button>
      </form>

      <form id="form-register" class="form" hidden novalidate>
        <label for="reg-name">Name</label>
        <input id="reg-name" name="name" type="text" autocomplete="name" required>

        <label for="reg-email">Email</label>
        <input id="reg-email" name="email" type="email" autocomplete="email" required>

        <label for="reg-password">Password</label>
        <input id="reg-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
        <p class="hint">At least 8 characters.</p>

        <p class="error" role="alert" aria-live="polite"></p>
        <button class="submit" type="submit">Create account</button>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
